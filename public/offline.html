<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mehrvila - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        background: #ffffff;
        color: #262626;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-size: 2rem;
        margin: 0;
      }
      p {
        color: #737373;
        font-size: 0.9rem;
        margin: 0;
      }
      button {
        margin-top: 12px;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #3b82f6;
        color: white;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Mehrvila</h1>
    <p>You're offline. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>

</html>
